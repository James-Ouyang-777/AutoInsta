# Daily scene rotation for the Kittenz brand.
#
# Selected deterministically by day: date.toordinal() % len(scenes), so the
# rotation is stateless (no "last posted" bookkeeping needed) and self-heals
# if a day is skipped. Add/reorder entries freely — the index just shifts.
#
# Each entry is a mini-story with setup → tiny problem → payoff.
# Motion prompts open with a strong first-second hook, then land the beat.
#
# Fields:
#   scene:      required — fed into brand.scene_prompt() for the still image.
#   characters: optional — list of character keys to feature (default: all).
#   motion:     optional — fed to the image-to-video animation step.
#               Brand sound.direction (cute baby kitten voices) is appended
#               automatically when audio is enabled.

scenes:
  - scene: >
      Mini-story beat: Cocoa bats a yarn ball under the couch (chaos), Snow carefully
      peeks underneath to help (gentle), then both look proud as Cocoa rolls it back out.
      Soft pastel living room, uncluttered.
    characters: [snow, cocoa]
    motion: >
      First second: Cocoa suddenly bats the yarn hard under the couch. Then Snow cautiously
      peeks underneath; Cocoa rolls the yarn back out; both do a tiny proud bounce. Soft
      baby mews that brighten on the payoff. Camera holds then gently pushes in.

  - scene: >
      Mini-story beat: Snow sits carefully on a windowsill watching rain, Cocoa hops up too
      boldly and slips a little, Snow steadies Cocoa with a gentle paw, then they watch the
      rain together. Soft rainy-window light.
    characters: [snow, cocoa]
    motion: >
      First second: Cocoa hops up onto the sill with an abrupt wobble. Snow steadies Cocoa;
      both settle and look outside together. Soft questioning chirps then contented mews.
      Camera slowly pans with the rain.

  - scene: >
      Mini-story beat: Cocoa discovers an empty cardboard box and dives in too fast, the box
      tips, Snow carefully rights it, then both peek out side by side like tiny royalty.
    characters: [snow, cocoa]
    motion: >
      First second: Cocoa dive-bombs into the box and it tips. Snow carefully rights the box;
      both peek out together with soft curious chirps then happy mews. Camera gently pushes in.

  - scene: >
      Mini-story beat: Cocoa chases a floating feather across a spare pastel room, almost
      catches it, misses, then Snow gently traps the feather with one careful paw so Cocoa
      can tap it triumphantly.
    characters: [snow, cocoa]
    motion: >
      First second: Cocoa lunges after the floating feather. Misses; Snow carefully pins the
      feather; Cocoa taps it proudly. Excited baby squeaks then a happy payoff mew. Camera
      tracks the chase then holds.

  - scene: >
      Mini-story beat: Snow is carefully arranging tiny folded towels into a neat stack;
      Cocoa barges in and flops on top; Snow looks mildly offended then accepts the cuddle
      loaf on the towels.
    characters: [snow, cocoa]
    motion: >
      First second: Cocoa flops onto Snow's neat towel stack. Snow blinks offended, then
      melts into a double loaf. Soft squeak then contented purrs. Camera holds with a gentle
      zoom.

  - scene: >
      Mini-story beat: Cocoa tries to drink from a tiny milk saucer too eagerly and gets a
      milk mustache; Snow carefully licks a paw and taps Cocoa's face clean; both look
      smug at the camera.
    characters: [snow, cocoa]
    motion: >
      First second: Cocoa dives at the saucer and comes up with a milk mustache. Snow taps
      Cocoa's face clean; both look at camera proudly. Soft baby mews. Camera holds steady.

  - scene: >
      Mini-story beat: Snow carefully steps across sofa cushions like a tiny marshmallow
      bridge; Cocoa tries to copy, wobbles dramatically, Snow waits and guides Cocoa to the
      last cushion for a shared victory sit.
    characters: [snow, cocoa]
    motion: >
      First second: Cocoa starts the cushion crossing with a big wobble. Snow guides Cocoa
      to the final cushion; both sit proudly. Tiny squeaky mews then a bright payoff chirp.
      Camera tracks alongside.

  - scene: >
      Mini-story beat: Cocoa finds a teacup and claims it as a throne too boldly, tipping
      it; Snow carefully sits Snow-style in the upright cup while Cocoa sits beside it like
      a loyal chaos knight.
    characters: [snow, cocoa]
    motion: >
      First second: Cocoa tip-claims the teacup and it rocks. Snow settles carefully into
      the cup; Cocoa sits beside it proudly. Soft proud mews. Camera holds then slowly
      pushes in.

  - scene: >
      Mini-story beat: Snow is napping in a sunbeam; Cocoa sneaks up to startle-pounce but
      lands soft and just snuggles in; Snow half-opens eyes, accepts it, both loaf in the light.
    characters: [snow, cocoa]
    motion: >
      First second: Cocoa soft-pounces into the sunbeam beside Snow. Snow blinks awake,
      accepts the snuggle, both breathe together. Tiny sleepy squeaks then soft purrs.
      Camera slowly pushes in.

  - scene: >
      Mini-story beat: Cocoa knocks a single ball of yarn off a low table; Snow carefully
      retrieves it and places it back; Cocoa immediately bats it off again; both freeze,
      then laugh-mew at each other.
    characters: [snow, cocoa]
    motion: >
      First second: yarn ball falls as Cocoa bats it. Snow retrieves and replaces it;
      Cocoa bats it off again; both freeze then happy-mew. Playful chirps. Camera holds
      with a tiny tilt.

  - scene: >
      Mini-story beat: Snow carefully carries a tiny toy mouse toward a cushion nest; Cocoa
      steals it mid-walk with a proud hop; Snow looks betrayed for one beat, then they play
      tug-of-war gently and share the nest.
    characters: [snow, cocoa]
    motion: >
      First second: Cocoa steals the toy with a sudden hop. One betrayed Snow blink, then
      gentle tug-of-war into a shared nest cuddle. Soft dramatic mew then happy chirps.
      Camera pushes in on the nest.

  - scene: >
      Mini-story beat: Cocoa tries to open a tiny pantry door with bold headbutts; Snow
      watches, then gently presses the door closed with one paw; Cocoa accepts defeat and
      they loaf against the door together instead.
    characters: [snow, cocoa]
    motion: >
      First second: Cocoa headbutts the pantry door. Snow calmly presses it shut; Cocoa
      accepts and both loaf together. Soft frustrated chirp then contented mews. Camera
      holds steady.
