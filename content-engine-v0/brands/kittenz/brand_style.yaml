# Brand consistency spec — single source of truth for captions AND images.
# Anything marked TODO is a placeholder guess: edit it once, then never let
# prompts contradict it. The whole "character" block should be pasted into
# every image prompt verbatim — image models have no memory between runs, so
# consistency comes from repeating the exact same character sheet every time.

brand:
  name: "Kittenz"
  one_liner: "Two ultra-round 3D kittens living soft, cozy little lives — Snow the careful one, Cocoa the chaos."
  topic_domain: "cute kitten mini-stories with clear Snow vs Cocoa chemistry"

# Key of the character block below (must match a references/<key>.png file).
main_character: "snow"

# ---------------------------------------------------------------------------
# CHARACTER CANON — Snow (white kitten). Never deviate.
# ---------------------------------------------------------------------------
character:
  name: "Snow"
  form: "an ultra-round, chibi 3D kitten toy character"
  body: "pure soft WHITE fur, nearly spherical body, tiny stubby limbs, plush clay-like surface"
  face: "two clearly visible solid round BLACK eyes (never missing, never white-on-white), tiny pink triangular nose, tiny closed-curve smile — minimal but readable features"
  limbs: "very short stubby paws and a short plump white tail curled close to the body"
  size: "tiny and toy-like — about the size of a teacup"
  personality: "gentle, careful, slightly regal; thinks before acting; the soft stabilizer of the duo"
  role: "the careful planner — hesitates, then helps Cocoa clean up the mess"
  invariants:
    - "Snow is ALWAYS pure white — never cream, gray, or patterned"
    - "Exactly one Snow per image when featured; never clones"
    - "Body is extremely round / ball-like — head and body nearly one continuous sphere"
    - "Minimal face but eyes MUST always be clearly visible solid black dots — never blank/eyeless face"
    - "Only simple eyes + tiny nose + tiny smile — no detailed fur, no whisker mess, no clutter"
    - "Same soft matte 3D toy look every time — never photoreal cat"
    - "Behavior reads as careful/gentle — never the chaos-starter"

# Secondary cast — same house style and round proportions as Snow.
supporting_characters:
  cocoa:
    name: "Cocoa"
    form: "an ultra-round, chibi 3D kitten toy character, same proportions as Snow"
    body: "soft warm BROWN fur (milk-chocolate tone), nearly spherical body, tiny stubby limbs, plush clay-like surface"
    face: "two clearly visible solid round BLACK eyes, tiny pink triangular nose, tiny closed-curve smile — minimal but readable features"
    limbs: "very short stubby paws and a short plump brown tail curled close to the body"
    personality: "curious, bold, slightly clumsy; acts first, thinks later; lovable chaos"
    role: "the adventure starter — bats, hops, peeks, knocks things, then looks proud"
    invariants:
      - "Cocoa is ALWAYS warm brown — never black, orange tabby, or white"
      - "Same extreme roundness as Snow — never lanky or realistic"
      - "Distinguish from Snow by color AND energy — Cocoa initiates the action"
      - "Never photoreal — always soft matte 3D toy render"

# ---------------------------------------------------------------------------
# SOUND — native audio direction for image-to-video (Kling generate_audio).
# Appended to every motion prompt when audio is enabled.
# ---------------------------------------------------------------------------
sound:
  direction: >
    only cute baby kitten vocalizations: tiny soft mews, gentle high-pitched
    baby kitten squeaks, soft contented purrs, little questioning chirps.
    No human speech, no adult voices, no singing, no music with lyrics,
    no harsh sounds. Keep volume soft and adorable. Match sound intensity
    to the story beats — quieter setup, brighter mew on the payoff.
  never:
    - "human speech"
    - "adult voices"
    - "singing with words"
    - "music lyrics"
    - "robotic TTS"
    - "loud or scary sounds"

# ---------------------------------------------------------------------------
# VISUAL STYLE — how every image is rendered.
# ---------------------------------------------------------------------------
visual_style:
  rendering: "minimal soft 3D toy render, claymation / plasticine feel, ultra-round forms, clean surfaces, almost no texture detail"
  lighting: "bright soft studio light, gentle ambient occlusion, soft shadows"
  background: "simple pastel or soft-neutral sets; uncluttered, shallow depth, cozy but spare"
  palette: "soft pastels and warm neutrals so white and brown fur read clearly"
  composition: "kitten(s) are the clear hero, centered or rule-of-thirds; generous negative space"
  aspect: "1:1 square, 1024x1024"
  never:
    - "no text, lettering, numbers, or logos rendered inside the image"
    - "no watermarks"
    - "no realistic human faces"
    - "no photoreal cats or real fur photography"
    - "no busy patterns, busy environments, or visual clutter"
    - "no sharp angles — everything stays soft and round"
    - "no horror, injury, or scary expressions"

# ---------------------------------------------------------------------------
# VOICE — how every caption sounds.
# ---------------------------------------------------------------------------
voice:
  tone: "self-aware, warm, lightly roasting; AI narrator reacting to the kitten story"
  person: >
    The caption is written as the AI itself reacting to the mini-story — not as Snow,
    not as Cocoa, not as a brand marketer. First person as the model/AI ('I', 'me'),
    playfully acknowledging being an AI/clanker watching this tiny drama.
  audience: "people who like cute pet content and dry internet humor"
  reading_level: "casual, short sentences"
  caption_style: >
    exactly ONE short sentence that is the AI's own reaction to the story —
    amused, impressed, emotionally invested, or lightly unhinged in a wholesome way.
    Must sound like a robot/AI watching cartoon kittens, not a narrator summarizing them.
    Good vibe examples (do not copy verbatim):
      - "wow that story was riveting even for a clanker like me"
      - "I came for extended cognition research and stayed for the feather drama"
      - "my cooling fans sped up during that plot twist"
    Bad (do not write like this): "Cocoa's got the moves, but Snow's the true hero"
    No hashtags. No CTA. No multi-line blocks.
  emojis: "usually none; at most 1 if it lands naturally"
  max_chars: 160
  prohibited:
    - "to die for"
    - "literally"
    - "any health or medical claims"
    - "guaranteed"
    - "as an AI language model"
    - "I'm just an AI"
