name: Daily brand post

on:
  schedule:
    # 5pm America/New_York is 21:00 UTC during EDT and 22:00 UTC during EST.
    # Both fire every day; the guard step below only lets the one that
    # currently matches local 5pm through.
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually post to Instagram (unchecked = preview only)"
        type: boolean
        default: false

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Guard — only proceed at 5pm America/New_York on scheduled runs
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=America/New_York date +%H)" != "17" ]; then
            echo "Not 5pm America/New_York right now — skipping this scheduled trigger."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Install content-engine-v0
        if: steps.guard.outputs.skip != 'true'
        run: pip install -e content-engine-v0

      - name: Generate and post today's Reel
        if: steps.guard.outputs.skip != 'true'
        working-directory: content-engine-v0
        env:
          LLM_API_BASE: https://api.openai.com/v1
          LLM_MODEL: gpt-4o-mini
          IMAGE_MODEL: gpt-image-1
          REQUEST_TIMEOUT_SECONDS: "120"
          BRAND: jammy-o
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" != "true" ]; then
            FLAGS="--no-publish"
          fi
          python daily_brand_post.py $FLAGS

      - name: Upload generated media
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: post-${{ github.run_id }}
          path: content-engine-v0/generated/
          retention-days: 14
          if-no-files-found: ignore
